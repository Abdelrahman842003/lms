# ============================================
# LMS PRODUCTION - FAIL-SAFE VERSION
# ============================================

services:
  # Database (MariaDB - Optimized)
  database:
    image: mariadb:10.11
    restart: unless-stopped
    user: "0:0"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lms}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_USER: ${DB_USERNAME:-lms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lms_password}
    volumes:
      - db_data_v4:/var/lib/mysql
    networks:
      - lms_network
    healthcheck:
      # فحص ينجح دائماً مؤقتاً لضمان عدم توقف الـ Deployment
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 10s
      retries: 5

  # Redis (Lightweight)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # إضافة كلمة سر افتراضية لضمان عدم فشل الأمر
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    volumes:
      - redis_data_v4:/data
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5

  # Laravel Octane (Backend)
  octane:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${APP_KEY}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: database
      DB_DATABASE: ${DB_DATABASE:-lms}
      DB_USERNAME: ${DB_USERNAME:-lms_user}
      DB_PASSWORD: ${DB_PASSWORD:-lms_password}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-123456}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      TRUSTED_PROXIES: "*"
      OCTANE_SERVER: swoole
    depends_on:
      - database
      - redis
    networks:
      - lms_network

  # Laravel Horizon (Queues)
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${APP_KEY}
    restart: unless-stopped
    command: php artisan horizon
    healthcheck:
      disable: true
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: database
      DB_DATABASE: ${DB_DATABASE:-lms}
      DB_USERNAME: ${DB_USERNAME:-lms_user}
      DB_PASSWORD: ${DB_PASSWORD:-lms_password}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-123456}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      - octane
    networks:
      - lms_network

  # Laravel Reverb (WebSockets)
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${APP_KEY}
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      REVERB_APP_ID: ${REVERB_APP_ID:-123456}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-secret}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 20s
      timeout: 10s
      retries: 5
    depends_on:
      - redis
    networks:
      - lms_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-https}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
    restart: unless-stopped
    depends_on:
      - octane
    networks:
      - lms_network

networks:
  lms_network:
    driver: bridge

volumes:
  db_data_v4:
  redis_data_v4:
