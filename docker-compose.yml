# ============================================
# NEETAQ LMS - PRODUCTION (FINAL COOLIFY VERSION)
# ============================================

services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_v4:/var/lib/mysql
    networks:
      - coolify

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_v4:/data
    networks:
      - coolify

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${APP_KEY}
    restart: unless-stopped
    expose:
      - 8000
      - 8080
    environment:
      # المتغيرات دي هي اللي بتخلي الخانات تظهر في واجهة Coolify
      SERVICE_FQDN_BACKEND: ${SERVICE_FQDN_BACKEND:-api.neetaq.com}
      SERVICE_FQDN_REVERB: ${SERVICE_FQDN_REVERB:-reverb.neetaq.com}
      APP_URL: "https://${SERVICE_FQDN_BACKEND:-api.neetaq.com}"
      REVERB_HOST: ${SERVICE_FQDN_REVERB:-reverb.neetaq.com}
      REVERB_PORT: 443
      REVERB_SCHEME: https
      # متغيرات الربط الأساسية
      DB_HOST: database
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      OCTANE_SERVER: swoole
      TRUSTED_PROXIES: "*"
      # Reverb Config
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
    depends_on:
      - database
      - redis
    networks:
      - coolify
    labels:
      - "coolify.managed=true"
      - "coolify.port=8000"
      - "traefik.enable=true"
      # توجيه الريفيرب للدومين الخاص بيه وبورت 8080 داخلياً
      - "traefik.http.routers.backend-reverb.rule=Host(`${SERVICE_FQDN_REVERB:-reverb.neetaq.com}`)"
      - "traefik.http.routers.backend-reverb.entrypoints=websecure"
      - "traefik.http.routers.backend-reverb.tls=true"
      - "traefik.http.routers.backend-reverb.service=backend-reverb"
      - "traefik.http.services.backend-reverb.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
    restart: unless-stopped
    expose:
      - 3000
    environment:
      SERVICE_FQDN_FRONTEND: ${SERVICE_FQDN_FRONTEND:-neetaq.com}
    depends_on:
      - backend
    networks:
      - coolify
    labels:
      - "coolify.managed=true"
      - "coolify.port=3000"

networks:
  coolify:
    external: true

volumes:
  db_data_v4:
  redis_data_v4:
