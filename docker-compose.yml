# ============================================
# LMS PRODUCTION DEPLOYMENT (Coolify) - ULTRA STABLE VERSION
# ============================================

services:
  # MySQL Database - Optimized for low RAM
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=1M
      - --max-connections=50
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lms}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:-lms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lms_network
    deploy:
      resources:
        limits:
          memory: 512M # حماية الخادم من استهلاك MySQL المفرط
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s # زيادة وقت السماح عند التشغيل الأول

  # Redis - High Performance / Low RAM
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --maxmemory 128mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    volumes:
      - redis_data:/data
    networks:
      - lms_network
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Octane (Backend)
  octane:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${APP_KEY}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      OCTANE_SERVER: swoole
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms_network
    deploy:
      resources:
        limits:
          memory: 512M

  # Laravel Horizon (Queue Manager)
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${APP_KEY}
    restart: unless-stopped
    command: php artisan horizon
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    depends_on:
      octane:
        condition: service_started
    networks:
      - lms_network
    deploy:
      resources:
        limits:
          memory: 256M

  # Laravel Reverb (WebSockets)
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${APP_KEY}
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
    depends_on:
      - redis
    networks:
      - lms_network
    deploy:
      resources:
        limits:
          memory: 256M

  # Next.js Frontend (Standalone Mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME}
    restart: unless-stopped
    depends_on:
      octane:
        condition: service_started
    networks:
      - lms_network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  lms_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
