# ============================================
# NEETAQ LMS - PRODUCTION (HEALTHCHECKS OPTIMIZED)
# ============================================

services:
  database:
    image: 'mariadb:10.11'
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'db_data_v4:/var/lib/mysql'
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u$${DB_USERNAME} -p$${DB_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: 'redis:7-alpine'
    restart: unless-stopped
    command: 'redis-server --requirepass ${REDIS_PASSWORD}'
    volumes:
      - 'redis_data_v4:/data'
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: '${APP_KEY}'
    restart: unless-stopped
    expose:
      - 8000
      - 8080
    environment:
      SERVICE_FQDN_BACKEND: '${SERVICE_FQDN_BACKEND:-api.neetaq.com}'
      SERVICE_FQDN_REVERB: '${SERVICE_FQDN_REVERB:-reverb.neetaq.com}'
      APP_URL: 'https://${SERVICE_FQDN_BACKEND:-api.neetaq.com}'
      REVERB_HOST: '${SERVICE_FQDN_REVERB:-reverb.neetaq.com}'
      REVERB_PORT: 443
      REVERB_SCHEME: https
      DB_HOST: database
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
      REDIS_HOST: redis
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      OCTANE_SERVER: swoole
      TRUSTED_PROXIES: '*'
      REVERB_APP_ID: '${REVERB_APP_ID}'
      REVERB_APP_KEY: '${REVERB_APP_KEY}'
      REVERB_APP_SECRET: '${REVERB_APP_SECRET}'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "coolify.managed=true"
      - "coolify.port=8000"
      - "traefik.enable=true"
      - "traefik.http.routers.backend-reverb.rule=Host(`${SERVICE_FQDN_REVERB:-reverb.neetaq.com}`)"
      - "traefik.http.routers.backend-reverb.entrypoints=websecure"
      - "traefik.http.routers.backend-reverb.tls=true"
      - "traefik.http.routers.backend-reverb.service=backend-reverb"
      - "traefik.http.services.backend-reverb.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL}'
        NEXT_PUBLIC_REVERB_APP_KEY: '${NEXT_PUBLIC_REVERB_APP_KEY}'
    restart: unless-stopped
    expose:
      - 3000
    environment:
      SERVICE_FQDN_FRONTEND: '${SERVICE_FQDN_FRONTEND:-neetaq.com}'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "coolify.managed=true"
      - "coolify.port=3000"

networks:
  coolify:
    external: true

volumes:
  db_data_v4:
  redis_data_v4:
