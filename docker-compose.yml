# ============================================
# NEETAQ LMS - EMERGENCY UNLOCK (STRIPPED VERSION)
# ============================================

services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    volumes:
      - db_data_v4:/var/lib/mysql
    networks:
      - lms_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - lms_network

  octane:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    networks:
      - lms_network

  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: php artisan horizon
    networks:
      - lms_network

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    networks:
      - lms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    networks:
      - lms_network

networks:
  lms_network:
    driver: bridge

volumes:
  db_data_v4:
  redis_data_v4:
