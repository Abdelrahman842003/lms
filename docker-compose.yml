# ============================================
# NEETAQ LMS - PRODUCTION (ULTIMATE NETWORK & LABEL FIX)
# ============================================

services:
  # Database
  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_v4:/var/lib/mysql
    networks:
      - coolify

  # Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_v4:/data
    networks:
      - coolify

  # Backend (Octane + Horizon + Reverb via Supervisor)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${APP_KEY}
    restart: unless-stopped
    expose:
      - 8000
      - 8080
    environment:
      APP_NAME: "${APP_NAME}"
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_HOST: database
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      OCTANE_SERVER: swoole
      TRUSTED_PROXIES: "*"
    depends_on:
      - database
      - redis
    networks:
      - coolify
    labels:
      - "coolify.managed=true"
      - "coolify.port=8000"
      - "traefik.enable=true"
      # إبقاء توجيه الريفيرب فقط لأنه بورت استثنائي (8080)
      - "traefik.http.routers.backend-reverb.rule=Host(`reverb.neetaq.com`)"
      - "traefik.http.routers.backend-reverb.entrypoints=websecure"
      - "traefik.http.routers.backend-reverb.tls=true"
      - "traefik.http.routers.backend-reverb.service=backend-reverb"
      - "traefik.http.services.backend-reverb.loadbalancer.server.port=8080"

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME}
    restart: unless-stopped
    expose:
      - 3000
    depends_on:
      - backend
    networks:
      - coolify
    labels:
      - "coolify.managed=true"
      - "coolify.port=3000"
      - "traefik.enable=true"

networks:
  coolify:
    external: true

volumes:
  db_data_v4:
  redis_data_v4:
