# ============================================
# NEETAQ LMS PRODUCTION - COOLIFY ULTIMATE UNLOCK
# ============================================

services:
  # Database
  database:
    image: mariadb:10.11
    restart: unless-stopped
    # كوليفاي سيقوم بحقن MYSQL_DATABASE و MYSQL_ROOT_PASSWORD تلقائياً من الواجهة
    volumes:
      - db_data_v4:/var/lib/mysql
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 10s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # سنستخدم الأمر الافتراضي، ويمكنك إضافة الباسورد من واجهة كوليفاي في خانة الـ Command إذا أردت
    # أو سيعمل بدون باسورد داخلياً وهو آمن داخل شبكة دكر
    networks:
      - lms_network

  # Laravel Octane
  octane:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      - database
      - redis
    networks:
      - lms_network
    labels:
      - "coolify.managed=true"

  # Laravel Horizon
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    command: php artisan horizon
    depends_on:
      - octane
    networks:
      - lms_network

  # Laravel Reverb
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - redis
    networks:
      - lms_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      - octane
    networks:
      - lms_network
    labels:
      - "coolify.managed=true"

networks:
  lms_network:
    driver: bridge

volumes:
  db_data_v4:
  redis_data_v4:
