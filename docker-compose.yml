# ============================================
# LMS DEVELOPMENT SETUP (Local)
# ============================================

# This file is strictly for Local Development.
# Use 'make dev' or 'docker compose up' to start.

x-backend-dev-env: &backend-dev-env
  APP_ENV: local
  APP_DEBUG: "true"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-lms}
  DB_USERNAME: ${DB_USERNAME:-lms_user}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_DRIVER: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-lms-app}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  OCTANE_SERVER: swoole
  SWOOLE_HTTP_HOST: 0.0.0.0
  SWOOLE_HTTP_PORT: 8000
  SWOOLE_HTTP_WATCH: "true"

x-frontend-args: &frontend-args
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
  NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY}
  NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:-localhost}
  NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-8080}
  NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-http}

services:
  # MySQL Database (Local)
  mysql:
    image: mysql:8.0
    container_name: lms_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lms}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-lms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis (Local)
  redis:
    image: redis:7-alpine
    container_name: lms_redis_dev
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Octane (Local Dev)
  octane_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lms_octane_dev
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - vendor_dev:/var/www/backend/vendor
    ports:
      - "8000:8000"
    environment:
      <<: *backend-dev-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      lms_network:
        aliases:
          - octane
    profiles: [dev]

  # Next.js Frontend (Local Dev)
  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        <<: *frontend-args
    container_name: lms_frontend_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules_dev:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      <<: *frontend-args
    depends_on:
      - octane_dev
    networks:
      - lms_network
    profiles: [dev]

  # Nginx (Local Proxy/SSL Simulator)
  nginx_dev:
    image: nginx:alpine
    container_name: lms_nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/wait-for-services.sh:/wait-for-services.sh:ro
    depends_on:
      - frontend_dev
      - octane_dev
    networks:
      - lms_network
    profiles: [dev]
    entrypoint: ["/bin/sh", "/wait-for-services.sh"]

networks:
  lms_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  vendor_dev:
    driver: local
  node_modules_dev:
    driver: local
