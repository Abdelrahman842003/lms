# ============================================
# NEETAQ LMS PRODUCTION - UNLOCKED VERSION
# ============================================

services:
  # Database
  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MY_DB_NAME:-neetaq}
      MYSQL_ROOT_PASSWORD: ${MY_DB_PASS:-Abdo842003..}
      MYSQL_USER: ${MY_DB_USER:-lms_user}
      MYSQL_PASSWORD: ${MY_DB_PASS:-Abdo842003..}
    volumes:
      - db_data_v4:/var/lib/mysql
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 10s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${MY_REDIS_PASS:-Abdo842003..}
    volumes:
      - redis_data_v4:/data
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MY_REDIS_PASS:-Abdo842003..}", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5

  # Laravel Octane
  octane:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${MY_APP_KEY}
    restart: unless-stopped
    environment:
      APP_NAME: "${MY_APP_NAME}"
      APP_ENV: production
      APP_KEY: "${MY_APP_KEY}"
      APP_URL: "${MY_APP_URL}"
      DB_HOST: database
      DB_DATABASE: "${MY_DB_NAME}"
      DB_USERNAME: "${MY_DB_USER}"
      DB_PASSWORD: "${MY_DB_PASS}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${MY_REDIS_PASS}"
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${MY_REVERB_ID}"
      REVERB_APP_KEY: "${MY_REVERB_KEY}"
      REVERB_APP_SECRET: "${MY_REVERB_SECRET}"
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      OCTANE_SERVER: swoole
      TRUSTED_PROXIES: "*"
    depends_on:
      - database
      - redis
    networks:
      - lms_network
    labels:
      - "coolify.managed=true"

  # Laravel Horizon
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${MY_APP_KEY}
    restart: unless-stopped
    command: php artisan horizon
    environment:
      APP_ENV: production
      APP_KEY: "${MY_APP_KEY}"
      DB_HOST: database
      DB_DATABASE: "${MY_DB_NAME}"
      DB_USERNAME: "${MY_DB_USER}"
      DB_PASSWORD: "${MY_DB_PASS}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${MY_REDIS_PASS}"
      QUEUE_CONNECTION: redis
    depends_on:
      - octane
    networks:
      - lms_network

  # Laravel Reverb
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_KEY: ${MY_APP_KEY}
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: production
      APP_KEY: "${MY_APP_KEY}"
      REVERB_APP_ID: "${MY_REVERB_ID}"
      REVERB_APP_KEY: "${MY_REVERB_KEY}"
      REVERB_APP_SECRET: "${MY_REVERB_SECRET}"
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
    depends_on:
      - redis
    networks:
      - lms_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${MY_APP_URL}
        NEXT_PUBLIC_REVERB_APP_KEY: ${MY_REVERB_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${MY_REVERB_PUB_HOST}
        NEXT_PUBLIC_REVERB_PORT: 443
        NEXT_PUBLIC_REVERB_SCHEME: https
    restart: unless-stopped
    depends_on:
      - octane
    networks:
      - lms_network
    labels:
      - "coolify.managed=true"

networks:
  lms_network:
    driver: bridge

volumes:
  db_data_v4:
  redis_data_v4:
