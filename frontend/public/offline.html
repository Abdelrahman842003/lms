<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>غير متصل - LMS</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #fff;
      }

      .container {
        text-align: center;
        padding: 2rem;
        max-width: 400px;
      }

      .icon {
        font-size: 5rem;
        margin-bottom: 1.5rem;
        animation: pulse 2s infinite;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
        color: #fff;
      }

      p {
        color: #94a3b8;
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        background: #4263eb;
        color: white;
        border: none;
        border-radius: 0.5rem;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.3s;
      }

      .btn:hover {
        background: #3b5bdb;
      }

      .status {
        margin-top: 2rem;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 0.5rem;
      }

      .status-indicator {
        display: inline-block;
        width: 10px;
        height: 10px;
        background: #ef4444;
        border-radius: 50%;
        margin-left: 0.5rem;
        animation: blink 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>يبدو أنك غير متصل بالإنترنت</h1>
      <p>
        لا يمكن تحميل الصفحة حالياً. تأكد من اتصالك بالإنترنت وحاول مرة أخرى.
      </p>
      <button class="btn" onclick="location.reload()">
        <span>🔄</span>
        <span>إعادة المحاولة</span>
      </button>

      <div class="status">
        <span class="status-indicator"></span>
        <span>الحالة: غير متصل</span>
      </div>
    </div>

    <script>
      // Auto-reload when back online
      window.addEventListener("online", () => {
        location.reload();
      });
    </script>
  </body>
</html>
