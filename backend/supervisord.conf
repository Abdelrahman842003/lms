[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-octane]
process_name=%(program_name)s_%(process_num)02d
command=php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/www/backend/storage/logs/octane.log
stderr_logfile=/var/www/backend/storage/logs/octane.error.log

[program:php-reverb]
command=php artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/www/backend/storage/logs/reverb.log
stderr_logfile=/var/www/backend/storage/logs/reverb.error.log

[program:php-horizon]
command=php artisan horizon
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/www/backend/storage/logs/horizon.log
stderr_logfile=/var/www/backend/storage/logs/horizon.error.log
