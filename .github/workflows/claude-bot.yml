name: Claude Bot

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    if: |
      github.event_name == 'issue_comment' && 
      contains(github.event.comment.body, '@claude')
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Anthropic SDK
        run: npm install -g @anthropic-ai/sdk

      - name: Create Bot Script
        run: |
          cat > claude-bot.js << 'ENDSCRIPT'
          const Anthropic = require('@anthropic-ai/sdk');
          const https = require('https');

          const anthropic = new Anthropic({
            apiKey: process.env.ANTHROPIC_API_KEY,
          });

          async function main() {
            const commentBody = process.env.COMMENT_BODY;
            const prompt = commentBody.replace(/@claude\s*/i, '').trim();
            
            if (!prompt) {
              console.log('No prompt found after @claude');
              return;
            }

            console.log('Processing prompt: ' + prompt.slice(0, 100) + '...');

            const fullPrompt = 'You are a helpful GitHub assistant for a Laravel + Next.js LMS project.\n\n' +
              'Project context:\n' +
              '- Backend: Laravel 12, PHP 8.2, Octane, MySQL, Redis\n' +
              '- Frontend: Next.js with App Router, TypeScript\n' +
              '- Repository: ' + process.env.REPO + '\n\n' +
              'User question: ' + prompt;

            try {
              const message = await anthropic.messages.create({
                model: "claude-sonnet-4-20250514",
                max_tokens: 4096,
                messages: [{
                  role: "user",
                  content: fullPrompt
                }]
              });

              const reply = message.content[0].text;
              console.log('Claude response generated successfully');

              const data = JSON.stringify({ body: reply });
              const options = {
                hostname: 'api.github.com',
                path: '/repos/' + process.env.REPO + '/issues/' + process.env.ISSUE_NUMBER + '/comments',
                method: 'POST',
                headers: {
                  'Authorization': 'token ' + process.env.GITHUB_TOKEN,
                  'User-Agent': 'Claude-Bot',
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json',
                  'Content-Length': data.length
                }
              };

              const req = https.request(options, (res) => {
                console.log('GitHub API Status: ' + res.statusCode);
                res.on('data', (d) => {
                  process.stdout.write(d);
                });
              });

              req.on('error', (error) => {
                console.error('GitHub API Error:', error);
                process.exit(1);
              });

              req.write(data);
              req.end();

              await new Promise(resolve => setTimeout(resolve, 2000));
              console.log('Comment posted successfully');

            } catch (error) {
              console.error('Error calling Claude API:', error.message);
              if (error.response) {
                console.error('Response:', error.response.data);
              }
              process.exit(1);
            }
          }

          main().catch((error) => {
            console.error('Unhandled error:', error);
            process.exit(1);
          });
          ENDSCRIPT

      - name: Run Claude Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: node claude-bot.js
