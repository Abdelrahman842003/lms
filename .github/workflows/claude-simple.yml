name: Claude Simple Bot

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Respond with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # Install dependencies
          npm install -g @anthropic-ai/sdk
          
          # Create simple script
          cat > respond.js << 'SCRIPT'
          const Anthropic = require('@anthropic-ai/sdk');
          const https = require('https');

          const anthropic = new Anthropic({
            apiKey: process.env.ANTHROPIC_API_KEY,
          });

          async function main() {
            const prompt = process.env.COMMENT_BODY.replace(/@claude\s*/i, '');
            
            const message = await anthropic.messages.create({
              model: "claude-sonnet-4-20250514",
              max_tokens: 2048,
              messages: [{
                role: "user",
                content: `You are a helpful GitHub bot. Respond to: ${prompt}`
              }]
            });

            const reply = message.content[0].text;
            
            // Post comment
            const data = JSON.stringify({ body: reply });
            const options = {
              hostname: 'api.github.com',
              path: `/repos/${process.env.REPO}/issues/${process.env.ISSUE_NUMBER}/comments`,
              method: 'POST',
              headers: {
                'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                'User-Agent': 'Claude-Bot',
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json',
                'Content-Length': data.length
              }
            };

            const req = https.request(options, (res) => {
              console.log(`Status: ${res.statusCode}`);
            });

            req.on('error', console.error);
            req.write(data);
            req.end();
          }

          main().catch(console.error);
          SCRIPT
          
          # Run the script
          node respond.js
