name: Claude Manual

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Your question for Claude'
        required: true
        type: string
      issue_number:
        description: 'Issue/PR number to reply to'
        required: true
        type: number

jobs:
  respond:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install SDK
        run: |
          npm init -y
          npm install @anthropic-ai/sdk
      
      - name: Ask Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUESTION: ${{ inputs.question }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          node -e "
          const Anthropic = require('@anthropic-ai/sdk');
          const https = require('https');
          
          (async () => {
            const anthropic = new Anthropic({ apiKey: process.env.ANTHROPIC_API_KEY });
            
            const message = await anthropic.messages.create({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 4096,
              messages: [{ role: 'user', content: process.env.QUESTION }]
            });
            
            const reply = message.content[0].text;
            const data = JSON.stringify({ body: reply });
            
            const req = https.request({
              hostname: 'api.github.com',
              path: '/repos/' + process.env.REPO + '/issues/' + process.env.ISSUE_NUMBER + '/comments',
              method: 'POST',
              headers: {
                'Authorization': 'token ' + process.env.GITHUB_TOKEN,
                'User-Agent': 'Claude-Bot',
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
              }
            }, (res) => console.log('Status:', res.statusCode));
            
            req.write(data);
            req.end();
          })();
          "
