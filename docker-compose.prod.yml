# ============================================
# LMS PRODUCTION DEPLOYMENT (Coolify)
# ============================================

# This file is strictly for Coolify/Production use.
# SSL, Nginx, and External Ports are managed by Coolify.

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: lms_mysql_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lms}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:-lms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # No ports exposed to host - internal communication only
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: lms_redis_prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # No ports exposed to host
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Octane (Backend)
  octane:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: lms_octane_prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OCTANE_SERVER: swoole
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms_network

  # Laravel Horizon (Queue)
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: lms_horizon_prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - mysql
      - redis
      - octane
    networks:
      - lms_network
    command: php artisan horizon

  # Laravel Reverb (WebSockets)
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: lms_reverb_prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - mysql
      - redis
    networks:
      - lms_network
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
    container_name: lms_frontend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - octane
      - reverb
    networks:
      - lms_network

networks:
  lms_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
