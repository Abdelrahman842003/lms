version: "3.8"

secrets:
  firebase_credentials:
    file: ./secrets/firebase_credentials.json
  firebase_project_id:
    file: ./secrets/firebase_project_id.txt
  cloudflare_r2_access_key_id:
    file: ./secrets/cloudflare_r2_access_key_id.txt
  cloudflare_r2_secret_access_key:
    file: ./secrets/cloudflare_r2_secret_access_key.txt
  cloudflare_r2_bucket:
    file: ./secrets/cloudflare_r2_bucket.txt
  cloudflare_r2_endpoint:
    file: ./secrets/cloudflare_r2_endpoint.txt
  cloudflare_r2_public_url:
    file: ./secrets/cloudflare_r2_public_url.txt
  cloudflare_kv_account_id:
    file: ./secrets/cloudflare_kv_account_id.txt
  cloudflare_kv_namespace_id:
    file: ./secrets/cloudflare_kv_namespace_id.txt
  cloudflare_kv_api_token:
    file: ./secrets/cloudflare_kv_api_token.txt

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./backend/public:/var/www/backend/public
    depends_on:
      - octane
      - frontend
      - reverb
    networks:
      - lms_network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: lms_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Octane (Backend)
  octane:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: lms_octane
    restart: unless-stopped
    secrets:
      - firebase_credentials
      - firebase_project_id
      - cloudflare_r2_access_key_id
      - cloudflare_r2_secret_access_key
      - cloudflare_r2_bucket
      - cloudflare_r2_endpoint
      - cloudflare_r2_public_url
      - cloudflare_kv_account_id
      - cloudflare_kv_namespace_id
      - cloudflare_kv_api_token
    volumes:
      - ./neetaq-54091-firebase-adminsdk-fbsvc-b830b7b75f.json:/var/www/backend/storage/firebase-credentials.json:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - BROADCAST_CONNECTION=reverb
      - OCTANE_SERVER=swoole
      - SWOOLE_HTTP_HOST=0.0.0.0
      - SWOOLE_HTTP_PORT=8000
      - SWOOLE_HTTP_WORKERS=4
      - SWOOLE_HTTP_TASK_WORKERS=6
      - SWOOLE_HTTP_MAX_REQUEST=500
      - SWOOLE_HTTP_WATCH=false
      - TELESCOPE_ENABLED=false
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase_credentials
      - FIREBASE_CREDENTIALS_FILE=/run/secrets/firebase_credentials
      - FIREBASE_PROJECT_ID_FILE=/run/secrets/firebase_project_id
      - CLOUDFLARE_R2_ACCESS_KEY_ID_FILE=/run/secrets/cloudflare_r2_access_key_id
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY_FILE=/run/secrets/cloudflare_r2_secret_access_key
      - CLOUDFLARE_R2_BUCKET_FILE=/run/secrets/cloudflare_r2_bucket
      - CLOUDFLARE_R2_ENDPOINT_FILE=/run/secrets/cloudflare_r2_endpoint
      - CLOUDFLARE_R2_PUBLIC_URL_FILE=/run/secrets/cloudflare_r2_public_url
      - CLOUDFLARE_KV_ACCOUNT_ID_FILE=/run/secrets/cloudflare_kv_account_id
      - CLOUDFLARE_KV_NAMESPACE_ID_FILE=/run/secrets/cloudflare_kv_namespace_id
      - CLOUDFLARE_KV_API_TOKEN_FILE=/run/secrets/cloudflare_kv_api_token
      # Reverb Configuration
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    command: sh -c "php artisan config:clear && php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --workers=4 --task-workers=6 --max-requests=500"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "php", "artisan", "octane:status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Laravel Horizon (Queue Worker)
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: lms_horizon
    restart: unless-stopped
    secrets:
      - firebase_credentials
      - firebase_project_id
      - cloudflare_r2_access_key_id
      - cloudflare_r2_secret_access_key
      - cloudflare_r2_bucket
      - cloudflare_r2_endpoint
      - cloudflare_r2_public_url
      - cloudflare_kv_account_id
      - cloudflare_kv_namespace_id
      - cloudflare_kv_api_token
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_CONNECTION=redis
      - BROADCAST_CONNECTION=reverb
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
    depends_on:
      - mysql
      - redis
      - octane
    networks:
      - lms_network
    command: php artisan horizon

  # Laravel Reverb (WebSocket Server)
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: lms_reverb
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_DRIVER=redis
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    depends_on:
      - mysql
      - redis
    networks:
      - lms_network
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    healthcheck:
      test: ["CMD", "php", "-r", "exit(fsockopen('localhost', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: lms_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_REVERB_APP_KEY=${REVERB_APP_KEY}
      - NEXT_PUBLIC_REVERB_HOST=${REVERB_PUBLIC_HOST}
      - NEXT_PUBLIC_REVERB_PORT=443
      - NEXT_PUBLIC_REVERB_SCHEME=https
    depends_on:
      - octane
      - reverb
    networks:
      - lms_network

networks:
  lms_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
